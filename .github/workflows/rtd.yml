name: Documentation
on:
  push:
  pull_request:
    branches:
      - master
      - develop
  workflow_dispatch:
    inputs:
      ref:
        description: 'The tag, branch or commit hash to trigger an RTD build for. Branches and tags must be fully formed, e.g. refs/heads/<branch> or refs/tags/<tag> respectively.'
        required: false
        type: string
        default: 'refs/heads/develop'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  set_options:
    name: Set options
    runs-on: ubuntu-22.04
    outputs:
      ref: ${{ steps.set_ref.outputs.ref }}
      sha: ${{ steps.set_sha.outputs.sha }}
    steps:

      - name: Set ref
        id: set_ref
        run: |
          # if ref was provided explicitly via workflow_dispatch, use it
          if [[ ("${{ github.event_name }}" == "workflow_dispatch") && (-n "${{ inputs.ref }}") ]]; then
            ref="${{ inputs.ref }}"
            echo "using ref $ref from workflow_dispatch"
          else
            # otherwise use the current branch
            ref="${{ github.ref }}"
            echo "using current ref $ref"
          fi
          echo "ref=$ref" >> $GITHUB_OUTPUT

      - name: Checkout flopy repo
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.set_ref.outputs.ref }}

      - name: Set sha
        id: set_sha
        run: |
          if [[ ("${{ github.event_name }}" == "workflow_dispatch") && (-n "${{ inputs.ref }}") ]]; then
            sha=$(git rev-parse ${{ steps.set_ref.outputs.ref }})
          else
            sha="${{ github.sha }}"
          fi
          echo "sha=$sha" >> $GITHUB_OUTPUT

  rtd_build:
    name: Prepare and test notebooks
    needs: set_options
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]

    defaults:
      run:
        shell: bash -l {0}

    steps:
      - name: Checkout flopy repo
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.set_options.outputs.ref }}
          path: flopy

      - name: Checkout MODFLOW 6
        uses: actions/checkout@v6
        with:
          repository: MODFLOW-ORG/modflow6
          path: modflow6

      - name: Output repo information
        run: |
          echo $GITHUB_REPOSITORY_OWNER
          echo $GITHUB_REPOSITORY
          echo $GITHUB_REF
          echo $GITHUB_EVENT_NAME

      - name: Setup Micromamba
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: flopy/etc/environment.yml
          cache-environment: true
          cache-downloads: true
          create-args: >-
            python=3.12
          init-shell: >-
            bash
            powershell

      - name: Install Python dependencies
        working-directory: flopy
        run: |
          pip install --upgrade pip
          pip install .
          pip install meson ninja

      - name: Workaround OpenGL issue on Linux
        if: runner.os == 'Linux'
        run: |
          # referenced from https://github.com/pyvista/pyvista/blob/main/.github/workflows/vtk-pre-test.yml#L53
          pip uninstall -y vtk
          pip install --extra-index-url https://wheels.vtk.org trame vtk-osmesa

      - name: Install fonts on Linux
        if: runner.os == 'Linux'
        run: |
          echo ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true | sudo debconf-set-selections
          sudo apt-get install ttf-mscorefonts-installer fonts-liberation
          sudo rm -rf ~/.cache/matplotlib

      - name: Install MODFLOW executables 29.0 (pinned asset)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          dl="$RUNNER_TEMP/modflow-downloads"
          mkdir -p "$dl" ~/.local/bin/modflow
          python3 flopy/.github/scripts/usgt_engine.py fetch --asset executables-29.0 --dest "$dl" --out usgt-engine
          python3 flopy/flopy/utils/get_modflow.py ~/.local/bin/modflow --owner MODFLOW-ORG --repo executables --release-id 29.0 --downloads-dir "$dl"
          if [[ "$RUNNER_OS" == "Windows" ]]; then cygpath -w ~/.local/bin/modflow; else echo ~/.local/bin/modflow; fi >> "$GITHUB_PATH"

      - name: Install triangle (macOS workaround)
        if: runner.os == 'macOS'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 flopy/flopy/utils/get_modflow.py ~/.local/bin/modflow --owner MODFLOW-ORG --repo executables --release-id 29.0 --ostag mac --subset triangle --downloads-dir "$RUNNER_TEMP/modflow-downloads"

      - name: Install USG-Transport 2.8.1 (pinned asset)
        run: |
          set -euo pipefail
          dl="$RUNNER_TEMP/modflow-downloads"
          python3 flopy/.github/scripts/usgt_engine.py fetch --asset mfusgt-v2.8.1 --dest "$dl" --out usgt-engine
          python3 flopy/.github/scripts/usgt_engine.py install-usgt --downloads "$dl" --bindir ~/.local/bin/mfusgt-2.8.1 --others ~/.local/bin/modflow --out usgt-engine

      - name: Setup GNU Fortran
        uses: fortran-lang/setup-fortran@v1
        with:
          compiler: gcc
          version: 13

      - name: Set up headless display
        uses: pyvista/setup-headless-display-action@v4

      - name: Build MODFLOW 6
        working-directory: modflow6
        run: |
          meson setup builddir --buildtype=debugoptimized --prefix=$(pwd) --libdir=bin
          meson install -C builddir
          meson test --verbose --no-rebuild -C builddir
          echo "$(pwd)/bin" >> $GITHUB_PATH

      - name: Record USG-Transport run folders before the notebooks
        run: python3 flopy/.github/scripts/usgt_engine.py snapshot --runs flopy/.docs/Notebooks --out usgt-engine

      # a failed snapshot does not stop the notebooks; the tutorial03 report fails on it
      - name: Record tutorial03 run folders before the notebooks
        continue-on-error: true
        run: python3 flopy/.github/scripts/usgt_engine.py snapshot-t03 --runs flopy/.docs/Notebooks --out usgt-engine

      - name: Run tutorial and example notebooks
        working-directory: flopy/autotest
        run: pytest -v -n auto test_example_notebooks.py

      - name: Check USG-Transport runs of tutorial06
        if: always()
        run: python3 flopy/.github/scripts/usgt_engine.py report --runs flopy/.docs/Notebooks --snapshot usgt-engine/snapshot.json --out usgt-engine

      - name: Check USG-Transport runs of tutorial03
        if: always()
        run: python3 flopy/.github/scripts/usgt_engine.py report-t03 --runs flopy/.docs/Notebooks --snapshot usgt-engine/snapshot-t03.json --install usgt-engine/install-usgt.json --export usgt-t03-evidence --out usgt-engine

      - name: Upload USG-Transport engine record
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: usgt-engine-docs-${{ runner.os }}
          path: usgt-engine/**
          if-no-files-found: warn

      - name: Upload tutorial03 run evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: usgt-t03-evidence-${{ runner.os }}
          path: usgt-t03-evidence/**
          if-no-files-found: warn

      - name: Upload notebooks artifact for ReadtheDocs
        if: |
          github.repository_owner == 'modflowpy' &&
          runner.os == 'Linux' &&
          (
            github.event_name == 'push' ||
            github.event_name == 'workflow_dispatch'
          )
        uses: actions/upload-artifact@v7
        with:
          name: notebooks-for-${{ needs.set_options.outputs.sha }}
          path: flopy/.docs/Notebooks/*.ipynb

  # trigger rtd if previous job was successful
  rtd:
    name: Read the Docs trigger
    needs:
      - rtd_build
      - set_options
    runs-on: ubuntu-latest
    if:
      github.repository_owner == 'modflowpy' &&
      (
          github.event_name == 'push' ||
          github.event_name == 'workflow_dispatch'
      )
    steps:
      - name: Trigger RTDs build
        uses: dfm/rtds-action@v1
        with:
          webhook_url: ${{ secrets.RTDS_WEBHOOK_URL }}
          webhook_token: ${{ secrets.RTDS_WEBHOOK_TOKEN }}
          commit_ref: ${{ needs.set_options.outputs.ref }}
